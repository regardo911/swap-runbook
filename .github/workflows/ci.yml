name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No install step on purpose. Everything here is standard library, and a
      # green run that quietly pip-installed something would prove the wrong thing.

      - name: syntax
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
          for f in $(git ls-files '*.py'); do python3 -m py_compile "$f"; done

      - name: tests
        run: |
          python3 -m unittest discover -s tests -v 2>&1 | tee out.txt
          # A suite that collects nothing exits 0. Assert it actually ran.
          grep -qE '^Ran [1-9][0-9]* tests?' out.txt \
            || { echo "the suite reported zero tests"; exit 1; }

      - name: the first command
        run: ./install.sh
